# Reviewed manual account-free synthetic emulator test. One 40-minute public standard-runner execution only; no signing, release, real accounts, chats, or model inference.
name: Menit Diagnostic synthetic emulator smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify reviewed synthetic smoke sources and run host regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum --check <<'HASHES'
          9f869104bec1e4b73bcf6bd94465a656653e881ec881ce6e0e604ac3a7a90670  diagnostic/app/src/main/java/com/vanipy/menit/diag/DiagActivity.java
          1ea9405f6b7339a2d4c75dcb630c2be99b1be6c8889368e465c91ff5bd934dce  diagnostic/tools/emulator-smoke.sh
          6573d13f5cb937eb8efc03bdb6476e31d59d6acd3ab7af1147aedf2a698eefb9  diagnostic/tools/emulator-helpers.sh
          4ad8e2bf78f05e4230ba5833981dde54616f2e870a92f1924eb5991dd9d41441  diagnostic/tools/emulator-helpers-test.sh
          7216c39dc38f895dde99c57fb71edf8d523c0d9f9ed495c19f5d0124976f577c  diagnostic/tools/layout-test.sh
          cbea2cf124afd4fb8f1759c5ad4bdef8ec99503270022208628e30753fba3b5c  diagnostic/tools/bracket-sorted-test.sh
          f609c6ce4c368faa988b56d2763b57406b12fd4d60b687824d750b8f5d97bd01  diagnostic/tools/verifier-report-test.sh
          HASHES
          bash diagnostic/tools/emulator-helpers-test.sh
          bash diagnostic/tools/layout-test.sh diagnostic/tools/emulator-helpers.sh
          bash diagnostic/tools/bracket-sorted-test.sh diagnostic/tools/emulator-helpers.sh
          bash diagnostic/tools/verifier-report-test.sh diagnostic/tools/emulator-helpers.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - name: Gradle 8.7 (checksum verified)
        run: |
          curl -sL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          echo "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  /tmp/g.zip" | sha256sum -c -
          unzip -q /tmp/g.zip -d /tmp
      - name: Unit tests and build debug APK
        run: /tmp/gradle-8.7/bin/gradle --no-daemon -p diagnostic :app:testDebugUnitTest :app:assembleDebug
      - name: Enable KVM on this disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, open and inspect only the synthetic diagnostic app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -wipe-data
          script: bash diagnostic/tools/emulator-smoke.sh
      - name: Save synthetic screenshots for visual UI review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: menit-diag-emulator-screenshots
          path: ${{ runner.temp }}/menit-diag-emulator-evidence/*.png
          if-no-files-found: warn
          retention-days: 1
          # Screenshots are synthetic UI evidence only; the typed event log is the service-behavior evidence.
