plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vanipy.menit'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vanipy.menit'
        minSdk 26
        targetSdk 34
        versionCode = (project.findProperty('versionCode') ?: '4').toString().toInteger()
        versionName = (project.findProperty('versionName') ?: '0.2.0').toString()
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all { systemProperty 'robolectric.graphicsMode', 'NATIVE' }
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1' // test-only, not in the APK
}
